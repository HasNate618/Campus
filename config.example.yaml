# Campus config — copy to config.yaml (gitignored) and fill in.
# Secrets prefer env vars: CAMPUS_USERNAME, CAMPUS_BRIGHTSPACE_PASSWORD.
#
# ZERO-CONFIG DEFAULTS: every service below is optional. With an empty
# config.yaml the harness still runs — sample data seeds in, you can browse
# courses, and the corpus search uses a built-in lexical ranker (no embeddings
# model needed). Only set what you have.

# Your institution's LMS (Brightspace/D2L-compatible) instance.
base_url: ""                      # e.g. "https://your-university.brightspace.com"
username: ""                      # or env CAMPUS_USERNAME
# password: ""                   # use env CAMPUS_BRIGHTSPACE_PASSWORD instead

# Brightspace-only features (content proxy + link rebasing). Leave empty for
# a non-Brightspace deployment; the proxy/sanitizer simply stays disabled.
# brightspace_hosts: []           # e.g. ["your-university.brightspace.com", "s.brightspace.com"]
# brightspace_base_url: ""        # e.g. "https://your-university.brightspace.com"

# paths
data_root: "./school"             # prod example: an absolute path on your server
db_path: "data/harness.db"
token_dir: "~/.campus"            # prod example: ~/.hippocampus

# auth
token_ttl: 3600

# optional single-password web auth; empty = open (demo) — set CAMPUS_WEB_PASSWORD in prod
web_password: ""

# services — all optional; empty = feature disabled.
# LLM endpoint(s): any OpenAI-compatible /v1 base URL. Empty = no chat/digest
# (sync + browse + lexical search still work). Examples:
#   OpenAI:      llm_url: "https://api.openai.com/v1"
#   OpenRouter:  llm_url: "https://openrouter.ai/api/v1"
#   local (Ollama): llm_url: "http://localhost:11434/v1"
# Give a LIST to fail over if one endpoint is down (or set CAMPUS_LLM_URLS):
#   llm_urls:
#     - "https://api.openai.com/v1"
#     - "http://localhost:11434/v1"
llm_url: ""
llm_urls: []                  # optional failover list; empty => [llm_url]
llm_model: ""                 # pick from: python -m sync models  (required for chat/digest)
llm_api_key: ""               # env CAMPUS_LLM_API_KEY; Bearer auth when set (OpenAI, OpenRouter, ...)
# PDF extraction: empty = local PyMuPDF (digital PDFs instant, scanned stay
# viewable). Set to a parser endpoint (Cohere Parse, Unstructured, Docling,
# ...) to route ALL PDFs through it.
# pdf_extractor_url: "http://localhost:8001"
# Sync notifications: empty = disabled. Set to an ntfy URL to get pings.
# ntfy_url: "https://ntfy.sh/campus-yourtopic"
# External tools: any streamable-HTTP MCP server exposing tools (web search,
# read, ...). Its tools are discovered at startup and added to the agent.
# Empty = no external MCP tools. Give a LIST to merge tools from several
# servers (or set CAMPUS_MCP_URLS). With several, tools are namespaced
# mcp1_*, mcp2_*, ... so they stay distinguishable.
# mcp_url: "http://localhost:11236/mcp"
# mcp_urls:
#   - "http://localhost:11236/mcp"
#   - "http://localhost:8000/mcp"

# Semantic corpus search is OPT-IN (most /v1 endpoints don't serve embeddings
# or rerank). Leave empty to use the lexical ranker (no extra model). Set both
# to enable semantic search; a 404 on either degrades back to lexical.
# embed_model: "text-embedding-3-small"
# rerank_model: "cohere/rerank-english-v3.0"

# timezone for user-facing datetimes + the system prompt clock.
# Empty = system local time. e.g. timezone: "America/Toronto"

# ── PDF parsing ────────────────────────────────────────────────────────────
# When empty: PyMuPDF extracts digital PDFs locally (instant, zero-config).
# Scanned PDFs (no text layer) are not extracted — they stay viewable but
# not searchable.
#
# When set: ALL PDFs (digital + scanned) go through the external parser.
# PyMuPDF is skipped entirely. The parser must accept raw PDF bytes via
# PUT /process and return {"page_content": "<markdown>", "metadata": {...}}.
# Examples: your Cohere Parse adapter, Unstructured, Docling, the old
# pdf-extractor container. Scans ≥long_scan_skip_pages are no longer
# auto-skipped (the parser handles them).
#
# pdf_extractor_url: "http://localhost:8001"
# auto-extract PDFs to markdown after sync? Set false if you don't want
# API credits spent on old content.
auto_extract_pdfs: true

# how many chars of extracted markdown feed the digest's PDF deltas
digest_pdf_excerpt_chars: 2000

# scanned PDFs (no text layer) at/above this many pages are skipped instead
# of OCR'd (~2 min/page locally). Re-run any file with `sync extract --file`.
# long_scan_skip_pages: 30

# term start/end dates — anchor class events for the calendar/chat context
# each term: start + end (YYYY-MM-DD). A bare start string also works.
# term_dates:
#   2026F:
#     start: "2026-09-01"
#     end: "2026-12-31"
#   2027W:
#     start: "2027-01-01"
#     end: "2027-04-30"

# sync scope — pilot only by default; flip to false for all courses
pilot_only: true
