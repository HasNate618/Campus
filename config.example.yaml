# Campus config — copy to config.yaml (gitignored) and fill in.
# Secrets prefer env vars: CAMPUS_USERNAME, CAMPUS_BRIGHTSPACE_PASSWORD.

base_url: "https://westernu.brightspace.com"
username: "user@example.com"
# password: ""            # use env CAMPUS_BRIGHTSPACE_PASSWORD instead

# paths
data_root: "{data_root}"     # prod; dev: ./school
db_path: "data/harness.db"
token_dir: "~/.hippocampus"

# auth
token_ttl: 3600

# services (docker network names; host ports when run on host)
bifrost_url: "http://127.0.0.1:18081/v1"
bifrost_model: "opencode-go/deepseek-v4-flash"   # pick from: python -m sync models
pdf_extractor_url: "http://127.0.0.1:8001"
ntfy_url: "http://127.0.0.1:8085"
trawl_url: "http://127.0.0.1:11236/mcp"

# auto-extract PDFs to markdown after sync? Cloud engine by default
# (pdf-extractor's default — no engine param). Set false if you don't want
# API credits spent on old content.
auto_extract_pdfs: true

# how many chars of extracted markdown feed the digest's PDF deltas
digest_pdf_excerpt_chars: 2000

# term start/end dates — anchor class events for the calendar/chat context
# each term: start + end (YYYY-MM-DD). A bare start string also works.
# term_dates:
#   2026F:
#     start: "2026-09-01"
#     end: "2026-12-31"
#   2027W:
#     start: "2027-01-01"
#     end: "2027-04-30"

# sync scope — H1: pilot only; flip to false when 2026F courses appear
pilot_only: true
