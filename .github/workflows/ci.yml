name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r api/requirements.txt -r requirements-dev.txt
          playwright install chromium --with-deps || true   # auth module import-safe; browsers optional for tests

      - name: Run tests
        shell: bash
        run: |
          python --version
          pip show pytest | head -2
          set +e
          pytest -q --tb=long > /tmp/pytest-output.txt 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::pytest exited $rc"
            tail -80 /tmp/pytest-output.txt | sed 's/^/::error::/'
          fi
          exit $rc

      - name: Upload test output (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest-output.txt

  web-build:
    name: Web build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npx tsc -b

      - name: Production build
        working-directory: web
        run: npm run build
