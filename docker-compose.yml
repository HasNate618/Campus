# Campus demo — run the web app with sample data, no homelab needed.
#
#   docker compose up --build
#   open http://localhost:8087
#
# Chat needs an OpenAI-compatible endpoint; set CAMPUS_LLM_URL (+ model + key)
# in the environment below. Everything else (timetable, courses, browse,
# search) works with the seeded sample data out of the box.

services:
  campus:
    build: .
    container_name: campus-demo
    ports:
      - "127.0.0.1:8087:8000"
    volumes:
      - campus-data:/app/data
    environment:
      CAMPUS_DB: /app/data/harness.db
      CAMPUS_DATA_ROOT: /app/data/school
      # OpenAI-compatible chat backend (optional for the demo):
      # CAMPUS_LLM_URL: https://api.openai.com/v1
      # CAMPUS_LLM_MODEL: gpt-4o-mini
      # CAMPUS_LLM_API_KEY: your-key   # only if the endpoint requires auth
      # CAMPUS_BRIGHTSPACE_HOSTS: ""        # proxy disabled by default
    restart: unless-stopped

volumes:
  campus-data:
