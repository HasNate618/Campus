# Campus demo — run the web app with sample data, no homelab needed.
#
#   docker compose up --build
#   open http://localhost:8087
#
# Chat needs an OpenAI-compatible endpoint; set OPENAI_ENDPOINT (+ model + key)
# in the environment below. Everything else (timetable, courses, browse,
# search) works with the seeded sample data out of the box.

services:
  campus:
    build: .
    container_name: campus-demo
    # The image runs as uid 1000 so it owns the mounted data volume. cap-drop
    # ALL removes CAP_DAC_OVERRIDE, so the container cannot read or write files
    # it does not own with root's authority, and no-new-privileges stops a
    # setuid binary from gaining any back.
    user: "1000:100"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:8087:8000"
    volumes:
      - campus-data:/app/data
    environment:
      CAMPUS_DB: /app/data/harness.db
      CAMPUS_DATA_ROOT: /app/data/school
      # OpenAI-compatible chat backend (optional for the demo):
      # OPENAI_ENDPOINT: https://api.openai.com/v1
      # OPENAI_MODEL: gpt-4o-mini
      # OPENAI_API_KEY: your-key   # only if the endpoint requires auth
      # The agent's shell tool is off unless this is set to 1:
      # CAMPUS_TERMINAL_ENABLED: "1"
    restart: unless-stopped

volumes:
  campus-data:
